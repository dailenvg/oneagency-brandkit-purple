<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=300,height=250">
<meta name="viewport" content="width=300,initial-scale=1">
<title>ONE Agency · Award ad · 300x250</title>
<!-- ONE Agency brand kit v2.0 (2026-11-20). Concept C: Award ad. Generated by scripts/build-motion-ads.mjs; edit the copy in src/data/ad-copy.ts and rebuild. -->
<style>
@font-face{font-family:"Geist";font-weight:500;src:url(fonts/geist-500.woff2) format("woff2")}
@font-face{font-family:"Geist";font-weight:600;src:url(fonts/geist-600.woff2) format("woff2")}
@font-face{font-family:"Geist";font-weight:700;src:url(fonts/geist-700.woff2) format("woff2")}
@font-face{font-family:"Unbounded";font-weight:600;src:url(fonts/unbounded-600.woff2) format("woff2")}
:root{--navy:#020257;--mint:#00fab3;--violet:#6203d0;--violet-light:#a08cec;--text:#ffffff;--text-2:#c2cbde;--on-accent:#020257;--edge:#223a7a;--surface:#020257}
*{box-sizing:border-box;margin:0}
html,body{width:300px;height:250px;overflow:hidden;background:var(--navy)}
#ad{position:relative;display:block;width:300px;height:250px;overflow:hidden;color:var(--text);text-decoration:none;font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.stack{position:absolute;inset:16px;display:flex;flex-direction:column;justify-content:center;gap:7px;align-items:flex-start;text-align:left}
.logo{display:block;width:40px;height:auto}
.bar{display:block;height:3px;width:48px;border-radius:8px;background:linear-gradient(90deg,var(--mint) 0%,var(--violet) 100%);transform-origin:left center;transform:scaleX(0)}
.eyebrow{font-family:Geist;font-weight:600;font-size:9px;line-height:1.2;letter-spacing:0.14em;text-transform:uppercase;color:var(--mint)}
.tag{display:inline-block;padding:3px 6px 2px;border:1px solid color-mix(in srgb,var(--text) 70%,transparent);font-family:Geist;font-weight:600;font-size:9px;line-height:1.2;letter-spacing:0.14em;text-transform:uppercase;letter-spacing:0.32em;color:var(--text)}
.headline{font-family:Unbounded;font-weight:600;font-size:18px;line-height:1.08;letter-spacing:-0.02em;max-width:268px;text-wrap:balance}
.acc{color:var(--mint)}
.sub{font-family:Geist;font-weight:500;font-size:13px;line-height:1.14;letter-spacing:-0.015em;color:var(--text-2);max-width:268px;text-wrap:balance}
.attr{font-family:Geist;font-weight:500;font-size:13px;line-height:1.14;letter-spacing:-0.015em;font-weight:700;color:var(--text)}
.cta{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--mint);color:var(--on-accent);font-family:Geist;font-weight:600;font-size:12px;line-height:1.2;letter-spacing:-0.01em;padding:7px 14px;opacity:0}
.small{font-family:Geist;font-weight:400;font-size:9px;line-height:1.4;letter-spacing:0em;color:var(--text-2)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));row-gap:6px;width:100%}
.stat{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding-inline:0px;opacity:0}
.stat:nth-child(even)::before{content:"";position:absolute;left:-8px;top:6%;bottom:6%;width:1px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--mint) 70%,transparent) 30%,color-mix(in srgb,var(--violet-light) 70%,transparent) 70%,transparent)}
.num{font-family:Unbounded;font-weight:600;font-size:16px;line-height:1.1;letter-spacing:-0.02em;color:var(--mint)}
.label{font-family:Geist;font-weight:500;font-size:9px;line-height:1.25;letter-spacing:0em}
.line{display:block;width:100%;height:0px;overflow:visible}
.line path{opacity:0}
.line circle{transform-box:fill-box;transform-origin:center;opacity:0}
.laurel{position:relative;display:grid;place-items:center;width:52px;height:52px;opacity:0}
.laurel img{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.laurel b{position:relative;font-family:Unbounded;font-weight:600;font-size:10px;letter-spacing:.04em}
.wipe{position:relative;display:inline-block}
.sweep{position:absolute;top:-10%;bottom:-10%;left:0;width:4px;background:linear-gradient(180deg,var(--mint) 0%,var(--violet) 100%);opacity:0}
.corner{position:absolute;top:16px;right:16px;width:40px;height:auto}
.row{display:flex;align-items:center;gap:10px}
</style>
</head>
<body>
<a id="ad" href="https://oneagency.com" target="_blank" rel="noopener">
<img class="corner" id="logo" src="logo-icon.svg" alt="ONE Agency">
<div class="stack">
  <div class="row"><div class="laurel" id="laurel"><img src="laurel.svg" alt=""><b>2026</b></div>
  <div><p class="tag" id="eyebrow">Winner</p>
  <h1 class="headline" id="headline">Best AI Product</h1></div></div>
  <p class="sub" id="sub">2026 ARDY Awards, American Resort Development Association</p>
  <p class="wipe"><span class="attr" id="attr">Awarded to ConversionIQ.ai</span><span class="sweep" id="sweep" aria-hidden="true"></span></p>
  <span class="cta" id="cta">Talk to ONE Agency</span>
  <p class="small" id="small">(689) 205-9923 · oneagency.com</p>
  
</div>
</a>
<script src="one-motion.js"></script>
<script>
var clickTag = 'https://oneagency.com'
document.getElementById('ad').addEventListener('click', function (e) { e.preventDefault(); window.open(clickTag, '_blank') })
;(function () {
  var M = window.OneMotion
  var $ = function (id) { return document.getElementById(id) }
  var el = {
    logo: $('logo'), bar: $('bar'), eyebrow: $('eyebrow'), headline: $('headline'), sub: $('sub'),
    attr: $('attr'), sweep: $('sweep'), laurel: $('laurel'), cta: $('cta'), small: $('small'),
    linePath: $('line-path'), lineDot: $('line-dot'), lineRing: $('line-ring'),
    stats: Array.prototype.slice.call(document.querySelectorAll('.stat'))
  }
  function render(t) {
  M.pop(el.laurel, t, 0.1)
  M.hop(el.eyebrow, t, 0.5)
  M.rise(el.headline, t, 0.85, { accent: [1] })
  M.rise(el.sub, t, 1.5)
  M.wipe({ sweep: el.sweep, to: el.attr, width: el.attr.offsetWidth }, t, 2.3)
  M.logoIn(el.logo, t, 2.7)
  M.pop(el.cta, t, 3.2)
  M.rise(el.small, t, 3.6)
  }
  var params = new URLSearchParams(location.search)
  var still = params.has('export') || params.has('t')
  var ad = M.player(render, { duration: 8, autoplay: false })
  document.fonts.ready.then(function () {
    if (params.has('t')) ad.seek(Number(params.get('t')))
    else if (!still) ad.play()
  })
  window.oneAd = { duration: 8, width: 300, height: 250, seek: ad.seek, ready: document.fonts.ready }
})()
</script>
</body>
</html>
