<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=300,height=250">
<meta name="viewport" content="width=300,initial-scale=1">
<title>ONE Agency · Proof ad · 300x250</title>
<!-- ONE Agency brand kit v1.0 (2026-11-17). Concept B: Proof ad. Generated by scripts/build-motion-ads.mjs; edit the copy in src/data/ad-copy.ts and rebuild. -->
<style>
@font-face{font-family:"Geist";font-weight:500;src:url(fonts/geist-500.woff2) format("woff2")}
@font-face{font-family:"Geist";font-weight:600;src:url(fonts/geist-600.woff2) format("woff2")}
@font-face{font-family:"Geist";font-weight:700;src:url(fonts/geist-700.woff2) format("woff2")}
@font-face{font-family:"Lato";font-weight:700;src:url(fonts/lato-700.woff2) format("woff2")}
@font-face{font-family:"Metal";font-weight:400;src:url(fonts/metal-400.woff2) format("woff2")}
:root{--ground:#01030f;--rose:#ffa0aa;--rose-deep:#e8808c;--lilac:#378df0;--text:#ffffff;--text-2:#b0b2c1;--on-accent:#01030f;--form-copy:#e2e4ec;--edge:#1f212c;--surface:#0a0e1f;--bar:linear-gradient(90deg,#F59FAE 0%,#6D92DE 100%)}
*{box-sizing:border-box;margin:0}
html,body{width:300px;height:250px;overflow:hidden;background:var(--ground)}
#ad{position:relative;display:block;width:300px;height:250px;overflow:hidden;color:var(--text);text-decoration:none;font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.ground{position:absolute;inset:0;background:radial-gradient(72% 46% at 14% -6%,color-mix(in srgb,var(--rose) 34%,transparent),transparent 66%),radial-gradient(76% 50% at 92% 104%,color-mix(in srgb,var(--lilac) 48%,transparent),transparent 72%),var(--ground)}
.halo{position:absolute;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--lilac) 45%,transparent),color-mix(in srgb,var(--lilac) 16%,transparent) 55%,transparent);opacity:0}
.stack{position:absolute;inset:16px;display:flex;flex-direction:column;justify-content:center;gap:7px;align-items:flex-start;text-align:left}
.logo{display:block;width:64px;height:auto}
.bar{display:block;height:3px;width:48px;border-radius:8px;background:var(--bar);transform-origin:left center;transform:scaleX(0)}
.eyebrow{font-family:Geist;font-weight:600;font-size:9px;line-height:1.2;letter-spacing:0.14em;text-transform:uppercase;color:var(--rose)}
.tag{display:inline-block;padding:3px 6px 2px;border:1px solid color-mix(in srgb,var(--text) 70%,transparent);font-family:Geist;font-weight:600;font-size:9px;line-height:1.2;letter-spacing:0.14em;text-transform:uppercase;letter-spacing:0.32em;color:var(--text)}
.headline{font-family:Geist;font-weight:700;font-size:22px;line-height:1.04;letter-spacing:-0.03em;max-width:268px;text-wrap:balance}
.acc{font-family:Metal,Georgia,serif;font-weight:400;font-size:1.27em;line-height:.82;letter-spacing:0;background:linear-gradient(90deg,var(--rose) 0%,var(--lilac) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:.1em .05em .14em;margin:-.1em 0 -.14em}
.sub{font-family:Geist;font-weight:500;font-size:13px;line-height:1.14;letter-spacing:-0.015em;color:var(--text-2);max-width:268px;text-wrap:balance}
.attr{font-family:Geist;font-weight:500;font-size:13px;line-height:1.14;letter-spacing:-0.015em;font-weight:700;color:var(--text)}
.cta{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--rose);color:var(--on-accent);font-family:Geist;font-weight:600;font-size:12px;line-height:1.2;letter-spacing:-0.01em;padding:7px 14px;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--rose) 70%,transparent);opacity:0}
.small{font-family:Geist;font-weight:400;font-size:9px;line-height:1.4;letter-spacing:0em;color:var(--text-2)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));row-gap:6px;width:100%}
.stat{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding-inline:0px;opacity:0}
.stat:nth-child(even)::before{content:"";position:absolute;left:-8px;top:6%;bottom:6%;width:1px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--rose) 70%,transparent) 30%,color-mix(in srgb,var(--lilac) 70%,transparent) 70%,transparent)}
.num{font-family:Lato;font-weight:700;font-size:20px;line-height:1.1;letter-spacing:0em;background:linear-gradient(90deg,var(--rose),var(--lilac));-webkit-background-clip:text;background-clip:text;color:transparent}
.label{font-family:Geist;font-weight:500;font-size:9px;line-height:1.25;letter-spacing:0em}
.line{display:block;width:100%;height:0px;overflow:visible}
.line path{opacity:0}
.line circle{transform-box:fill-box;transform-origin:center;opacity:0}
.laurel{position:relative;display:grid;place-items:center;width:52px;height:52px;opacity:0}
.laurel img{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.laurel b{position:relative;font-family:Lato;font-weight:700;font-size:10px;letter-spacing:.04em}
.wipe{position:relative;display:inline-block}
.sweep{position:absolute;top:-10%;bottom:-10%;left:0;width:4px;background:linear-gradient(180deg,#F59FAE 0%,#6D92DE 100%);box-shadow:0 0 12px 3px color-mix(in srgb,var(--rose) 45%,transparent);opacity:0}
.corner{position:absolute;top:16px;right:16px;width:64px;height:auto}
.row{display:flex;align-items:center;gap:10px}
</style>
</head>
<body>
<a id="ad" href="https://oneagency.com" target="_blank" rel="noopener">
<div class="ground"></div>
<div class="halo" id="halo" style="left:130px;top:-60px;width:260px;height:260px"></div>
<div class="stack">
  <img class="logo" id="logo" src="logo-icon.svg" alt="ONE Agency">
  <h1 class="headline" id="headline">Results delivered. In any industry.</h1>
  
  <ul class="stats" style="list-style:none;padding:0">
    <li class="stat" id="stat-0"><span class="num">10M+</span><span class="label">Qualified leads generated</span></li>
    <li class="stat" id="stat-1"><span class="num">$100M+</span><span class="label">Media under management</span></li>
    <li class="stat" id="stat-2"><span class="num">7B+</span><span class="label">Brand impressions delivered</span></li>
    <li class="stat" id="stat-3"><span class="num">450K+</span><span class="label">E-commerce transactions</span></li>
  </ul>
  <span class="cta" id="cta">Run My Free Audit</span>
  <p class="small" id="small">Figures as published on oneagency.com, November 2026.</p>
</div>
</a>
<script src="one-motion.js"></script>
<script>
var clickTag = 'https://oneagency.com'
document.getElementById('ad').addEventListener('click', function (e) { e.preventDefault(); window.open(clickTag, '_blank') })
;(function () {
  var M = window.OneMotion
  var $ = function (id) { return document.getElementById(id) }
  var el = {
    halo: $('halo'), logo: $('logo'), bar: $('bar'), eyebrow: $('eyebrow'), headline: $('headline'), sub: $('sub'),
    attr: $('attr'), sweep: $('sweep'), laurel: $('laurel'), cta: $('cta'), small: $('small'),
    linePath: $('line-path'), lineDot: $('line-dot'), lineRing: $('line-ring'),
    stats: Array.prototype.slice.call(document.querySelectorAll('.stat'))
  }
  function render(t) {
  M.halo(el.halo, t, 0)
  M.logoIn(el.logo, t, 0)
  M.rise(el.headline, t, 0.5, { accent: [3] })
  if (el.linePath) M.lineDraw({ path: el.linePath, dot: el.lineDot, ring: el.lineRing }, t, 1.3)
  el.stats.forEach((s, i) => M.pop(s, t, 1.7 + i * 0.25))
  M.pop(el.cta, t, 3.3)
  M.rise(el.small, t, 3.7)
  }
  var params = new URLSearchParams(location.search)
  var still = params.has('export') || params.has('t')
  var ad = M.player(render, { duration: 9, autoplay: false })
  document.fonts.ready.then(function () {
    if (params.has('t')) ad.seek(Number(params.get('t')))
    else if (!still) ad.play()
  })
  window.oneAd = { duration: 9, width: 300, height: 250, seek: ad.seek, ready: document.fonts.ready }
})()
</script>
</body>
</html>
