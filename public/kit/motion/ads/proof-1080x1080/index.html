<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=1080,height=1080">
<meta name="viewport" content="width=1080,initial-scale=1">
<title>ONE Agency · Proof ad · 1080x1080</title>
<!-- ONE Agency brand kit v2.0 (2026-11-20). Concept B: Proof ad. Generated by scripts/build-motion-ads.mjs; edit the copy in src/data/ad-copy.ts and rebuild. -->
<style>
@font-face{font-family:"Geist";font-weight:500;src:url(fonts/geist-500.woff2) format("woff2")}
@font-face{font-family:"Geist";font-weight:600;src:url(fonts/geist-600.woff2) format("woff2")}
@font-face{font-family:"Geist";font-weight:700;src:url(fonts/geist-700.woff2) format("woff2")}
@font-face{font-family:"Unbounded";font-weight:600;src:url(fonts/unbounded-600.woff2) format("woff2")}
:root{--navy:#020257;--mint:#00fab3;--violet:#6203d0;--violet-light:#a08cec;--text:#ffffff;--text-2:#c2cbde;--on-accent:#020257;--edge:#223a7a;--surface:#020257}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1080px;overflow:hidden;background:var(--navy)}
#ad{position:relative;display:block;width:1080px;height:1080px;overflow:hidden;color:var(--text);text-decoration:none;font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.stack{position:absolute;inset:72px;display:flex;flex-direction:column;justify-content:center;gap:30px;align-items:center;text-align:center}
.logo{display:block;width:360px;height:auto}
.bar{display:block;height:8px;width:180px;border-radius:8px;background:linear-gradient(90deg,var(--mint) 0%,var(--violet) 100%);transform-origin:left center;transform:scaleX(0)}
.eyebrow{font-family:Geist;font-weight:600;font-size:30px;line-height:1.2;letter-spacing:0.14em;text-transform:uppercase;color:var(--mint)}
.tag{display:inline-block;padding:12px 24px 10px;border:2px solid color-mix(in srgb,var(--text) 70%,transparent);font-family:Geist;font-weight:600;font-size:30px;line-height:1.2;letter-spacing:0.14em;text-transform:uppercase;letter-spacing:0.32em;color:var(--text)}
.headline{font-family:Unbounded;font-weight:600;font-size:76px;line-height:1.08;letter-spacing:-0.02em;max-width:900px;text-wrap:balance}
.acc{color:var(--mint)}
.sub{font-family:Geist;font-weight:500;font-size:52px;line-height:1.14;letter-spacing:-0.015em;color:var(--text-2);max-width:860px;text-wrap:balance}
.attr{font-family:Geist;font-weight:500;font-size:52px;line-height:1.14;letter-spacing:-0.015em;font-weight:700;color:var(--text)}
.cta{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--mint);color:var(--on-accent);font-family:Geist;font-weight:600;font-size:44px;line-height:1.2;letter-spacing:-0.01em;padding:30px 60px;opacity:0}
.small{font-family:Geist;font-weight:400;font-size:24px;line-height:1.4;letter-spacing:0em;color:var(--text-2)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));row-gap:30px;width:100%}
.stat{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding-inline:16px;opacity:0}
.stat:nth-child(even)::before{content:"";position:absolute;left:0px;top:6%;bottom:6%;width:1px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--mint) 70%,transparent) 30%,color-mix(in srgb,var(--violet-light) 70%,transparent) 70%,transparent)}
.num{font-family:Unbounded;font-weight:600;font-size:70px;line-height:1.1;letter-spacing:-0.02em;color:var(--mint)}
.label{font-family:Geist;font-weight:500;font-size:30px;line-height:1.25;letter-spacing:0em}
.line{display:block;width:100%;height:80px;overflow:visible}
.line path{opacity:0}
.line circle{transform-box:fill-box;transform-origin:center;opacity:0}
.laurel{position:relative;display:grid;place-items:center;width:190px;height:190px;opacity:0}
.laurel img{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.laurel b{position:relative;font-family:Unbounded;font-weight:600;font-size:36px;letter-spacing:.04em}
.wipe{position:relative;display:inline-block}
.sweep{position:absolute;top:-10%;bottom:-10%;left:0;width:14px;background:linear-gradient(180deg,var(--mint) 0%,var(--violet) 100%);opacity:0}
.corner{position:absolute;top:72px;right:72px;width:360px;height:auto}
.row{display:flex;align-items:center;gap:10px}
</style>
</head>
<body>
<a id="ad" href="https://oneagency.com" target="_blank" rel="noopener">
<div class="stack">
  <img class="logo" id="logo" src="logo-horizontal.svg" alt="ONE Agency">
  <h1 class="headline" id="headline">Results delivered. In any industry.</h1>
  <svg class="line" id="line" viewBox="0 0 936 80" aria-hidden="true"><defs><linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="8" x2="920" y1="0" y2="0"><stop style="stop-color:var(--mint)"/><stop offset="1" style="stop-color:var(--violet-light)"/></linearGradient></defs><path id="line-path" pathLength="1" d="M8.0 72.0 L234.0 62.4 L421.2 49.6 L617.8 32.0 L786.2 19.2 L920.0 12.0" fill="none" stroke="url(#lg)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle id="line-ring" cx="920" cy="12" r="12" fill="none" stroke-width="4" style="stroke:var(--violet-light)"/><circle id="line-dot" cx="920" cy="12" r="12" style="fill:var(--violet-light)"/></svg>
  <ul class="stats" style="list-style:none;padding:0">
    <li class="stat" id="stat-0"><span class="num">10M+</span><span class="label">Qualified leads generated</span></li>
    <li class="stat" id="stat-1"><span class="num">$100M+</span><span class="label">Media under management</span></li>
    <li class="stat" id="stat-2"><span class="num">7B+</span><span class="label">Brand impressions delivered</span></li>
    <li class="stat" id="stat-3"><span class="num">450K+</span><span class="label">E-commerce transactions</span></li>
  </ul>
  <span class="cta" id="cta">Run My Free Audit</span>
  <p class="small" id="small">Figures as published on oneagency.com, November 2026.</p>
</div>
</a>
<script src="one-motion.js"></script>
<script>
var clickTag = 'https://oneagency.com'
document.getElementById('ad').addEventListener('click', function (e) { e.preventDefault(); window.open(clickTag, '_blank') })
;(function () {
  var M = window.OneMotion
  var $ = function (id) { return document.getElementById(id) }
  var el = {
    logo: $('logo'), bar: $('bar'), eyebrow: $('eyebrow'), headline: $('headline'), sub: $('sub'),
    attr: $('attr'), sweep: $('sweep'), laurel: $('laurel'), cta: $('cta'), small: $('small'),
    linePath: $('line-path'), lineDot: $('line-dot'), lineRing: $('line-ring'),
    stats: Array.prototype.slice.call(document.querySelectorAll('.stat'))
  }
  function render(t) {
  M.logoIn(el.logo, t, 0)
  M.rise(el.headline, t, 0.5, { accent: [3] })
  if (el.linePath) M.lineDraw({ path: el.linePath, dot: el.lineDot, ring: el.lineRing }, t, 1.3)
  el.stats.forEach((s, i) => M.pop(s, t, 1.7 + i * 0.25))
  M.pop(el.cta, t, 3.3)
  M.rise(el.small, t, 3.7)
  }
  var params = new URLSearchParams(location.search)
  var still = params.has('export') || params.has('t')
  var ad = M.player(render, { duration: 9, autoplay: false })
  document.fonts.ready.then(function () {
    if (params.has('t')) ad.seek(Number(params.get('t')))
    else if (!still) ad.play()
  })
  window.oneAd = { duration: 9, width: 1080, height: 1080, seek: ad.seek, ready: document.fonts.ready }
})()
</script>
</body>
</html>
