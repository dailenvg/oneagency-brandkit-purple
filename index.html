<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ONE Agency · Brand Kit</title>
    <meta name="description" content="ONE Agency brand kit v1.1: logos, colour, type, glass and texture, motion and templates, with downloads." />
    <meta name="theme-color" content="#01030f" />
    <meta name="color-scheme" content="dark light" />
    <!--
      Theme before first paint, so there is no flash of the wrong one: the saved choice (src/lib/theme.ts, same key),
      else the system setting. Storage can throw (private mode, blocked cookies), hence the try.
    -->
    <script>
      (function () {
        var theme
        try {
          theme = localStorage.getItem('oa-kit-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        var root = document.documentElement
        root.dataset.theme = theme
        root.style.colorScheme = theme
        if (theme === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f9fe')
      })()
    </script>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/kit/logos/favicon/one-agency_logo_favicon.svg" />
    <link rel="apple-touch-icon" href="/kit/logos/favicon/one-agency_logo_apple-touch-icon_180x180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--
      Link preview (ClickUp, Slack, iMessage). Scrapers need absolute URLs, so these name the deploy domain (the repo
      homepage). The image is built by scripts/build-og-image.mjs (npm run kit:og).

  <body>
    <!--
      The live site's accent light (oneagency.com neon.js, #oa-neon): blurred copies of the glyphs are added back onto
      them, so gradient text brightens toward a white-hot core while the edges and bloom keep the rose-to-blue colour.
      CSS drop-shadow can only glow underneath the fill. Inline because Chrome does not load filters from external SVGs.
    -->
    <svg aria-hidden="true" focusable="false" style="position: absolute; width: 0; height: 0; overflow: hidden">
      <filter id="oa-neon" x="-25%" y="-60%" width="150%" height="220%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="core" />
        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="glow" />
        <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="bloom" />
        <feComposite in="core" in2="glow" operator="arithmetic" k2="0.55" k3="0.75" result="cg" />
        <feComposite in="cg" in2="bloom" operator="arithmetic" k2="1" k3="0.8" result="light" />
        <feComposite in="SourceGraphic" in2="light" operator="arithmetic" k2="1" k3="1" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
